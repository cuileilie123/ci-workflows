name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== 前端检查 =====
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build:mp-weixin

  # ===== BFF 检查 =====
  bff-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-timeout=5s
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: mysql://root:test@localhost:3306/test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret
      WX_APPID: wx_test_appid
      WX_SECRET: wx_test_secret
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma db push
      - run: pnpm lint
      - run: pnpm test -- --coverage
      - run: pnpm test:e2e
      - run: pnpm build

  # ===== Docker 构建（需配置阿里云 ACR Secrets）=====
  docker-build:
    needs: [frontend-check, bff-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && secrets.ACR_REGISTRY != ''
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker images
        run: |
          docker compose build bff
          docker compose push bff

  # ===== 部署到 K8s（需配置 ACK Secrets）=====
  deploy:
    needs: [frontend-check, bff-check, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.KUBECONFIG != ''
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to ACK
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/bff bff=${{ secrets.ACR_REGISTRY }}/bff:${{ github.sha }}
          kubectl rollout status deployment/bff