name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "mysql://root:test@localhost:3306/test_db"
  REDIS_URL: "redis://localhost:6379"
  NODE_ENV: test

jobs:
  bff-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-calc "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-calc "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test -- --testPathPatterns=deadlock --passWithNoTests
      - name: Concurrent Deadlock Regression Tests
        run: pnpm test -- --testPathPatterns=deadlock --forceExit --detectOpenHandles
        timeout-minutes: 5
        if: always()
