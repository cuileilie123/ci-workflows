name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== 前端检查 =====
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build:mp-weixin

  # ===== BFF 检查 =====
  bff-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-timeout=5s
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: bff/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm test -- --coverage
      - run: pnpm build

  # ===== 风控服务（Go）检查 =====
  risk-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/risk-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go build -o risk-service ./cmd/main.go

  # ===== 管理后台（Java）检查 =====
  admin-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn clean test
      - run: mvn package -DskipTests

  # ===== Docker 构建 =====
  docker-build:
    needs: [frontend-check, bff-check, risk-check, admin-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker images
        run: |
          docker compose build
          docker compose push

  # ===== 部署到 K8s =====
  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to ACK
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/bff bff=${{ secrets.ACR_REGISTRY }}/bff:${{ github.sha }}
          kubectl set image deployment/risk risk=${{ secrets.ACR_REGISTRY }}/risk:${{ github.sha }}
          kubectl set image deployment/admin admin=${{ secrets.ACR_REGISTRY }}/admin:${{ github.sha }}
          kubectl rollout status deployment/bff
          kubectl rollout status deployment/risk
          kubectl rollout status deployment/admin
