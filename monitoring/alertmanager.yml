global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'wechat-webhook'

receivers:
  - name: 'wechat-webhook'
    webhook_configs:
      - url: 'http://webhook-bridge:8080/wechat'
        send_resolved: true
