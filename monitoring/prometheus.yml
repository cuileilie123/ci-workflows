global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'bff-nestjs'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bff:3000']
        labels:
          service: 'bff'
          env: 'production'
  
  - job_name: 'risk-go'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['risk-service:8080']
        labels:
          service: 'risk'
          env: 'production'
  
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
