server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nh_admin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:nh-admin-secret-key-2024-very-long-and-secure}
    expiration: 86400000  # 24h
